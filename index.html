<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B0F0D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Horas — finanças, trabalho e investimentos</title>
<link rel="manifest" href="manifest.webmanifest" />
<style>
/* ===== Tokens — 05-Design-System.md ===== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#F5F5F7;--glass:rgba(255,255,255,.6);--border:rgba(0,0,0,.08);
  --ink:#111114;--muted:rgba(0,0,0,.55);
  --success:#1FA971;--warning:#B9790A;--danger:#D23C3C;
  --accent:#2FD180;--accent2:#12B76A;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:24px;--space-xl:32px;
  --r-card:24px;--r-pill:999px;--r-control:14px;
  --mat-ultrathin:rgba(255,255,255,.5);--mat-thin:rgba(255,255,255,.62);--mat-regular:rgba(255,255,255,.82);--mat-thick:rgba(255,255,255,.94);
  --blur-thin:20px;--blur-regular:28px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0B0F0D;--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);
  --ink:#FFFFFF;--muted:rgba(255,255,255,.62);
  --success:#34D399;--warning:#F5A623;--danger:#F55B5B;
  --mat-ultrathin:rgba(20,24,22,.55);--mat-thin:rgba(24,29,27,.58);--mat-regular:rgba(18,22,20,.78);--mat-thick:rgba(14,17,16,.92);
}}
:root[data-theme="dark"]{
  --bg:#0B0F0D;--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.12);
  --ink:#FFFFFF;--muted:rgba(255,255,255,.62);
  --success:#34D399;--warning:#F5A623;--danger:#F55B5B;
  --mat-ultrathin:rgba(20,24,22,.55);--mat-thin:rgba(24,29,27,.58);--mat-regular:rgba(18,22,20,.78);--mat-thick:rgba(14,17,16,.92);
}
:root[data-theme="light"]{
  --bg:#F5F5F7;--glass:rgba(255,255,255,.6);--border:rgba(0,0,0,.08);
  --ink:#111114;--muted:rgba(0,0,0,.55);
  --success:#1FA971;--warning:#B9790A;--danger:#D23C3C;
  --mat-ultrathin:rgba(255,255,255,.5);--mat-thin:rgba(255,255,255,.62);--mat-regular:rgba(255,255,255,.82);--mat-thick:rgba(255,255,255,.94);
}
/* accent por aba — 05-Design-System.md §2.2 */
[data-tab="geral"]{--accent:#2FD180;--accent2:#12B76A}
[data-tab="contas"]{--accent:#5E8BFF;--accent2:#4169E1}
[data-tab="calendario"]{--accent:#F5A623;--accent2:#DB8A0A}
[data-tab="carteira"]{--accent:#22B8CF;--accent2:#0E8CA6}
[data-tab="transacoes"]{--accent:#5E8BFF;--accent2:#4169E1}
[data-tab="ajustes"]{--accent:#8B8FA3;--accent2:#6B7086}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--ink);font:400 15px/1.4 var(--font);background:var(--bg);overflow-x:hidden;padding-top:env(safe-area-inset-top);transition:background .25s}
h1,h2,h3{font-family:var(--font)}
.t-display{font-size:clamp(30px,8vw,38px);font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.t-title{font-size:21px;font-weight:700;letter-spacing:-.3px}
.t-headline{font-size:17px;font-weight:600}
.t-caption{font-size:13px;color:var(--muted)}
.t-pill{font-size:12px;font-weight:600}
.bg-tint{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(560px 380px at 15% -8%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 60%),
  radial-gradient(480px 420px at 110% 15%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 60%),
  var(--bg);transition:background .3s}
.shell{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) var(--space-md) 128px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-md)}
.topbar .greet{font-size:12px;color:var(--muted)}
.topbar h1{margin:1px 0 0;font-size:24px;font-weight:800;letter-spacing:-.6px}
.icon-btn{border:0;cursor:pointer;width:38px;height:38px;border-radius:var(--r-control);display:grid;place-items:center;color:var(--ink);background:var(--mat-thin);border:1px solid var(--border);backdrop-filter:blur(var(--blur-thin));-webkit-backdrop-filter:blur(var(--blur-thin))}
.icon-btn svg{width:18px;height:18px}
.avatar-btn{width:38px;height:38px;border-radius:13px;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;font-size:15px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* material */
.glass{position:relative;background:var(--mat-thin);border:1px solid var(--border);border-radius:var(--r-card);backdrop-filter:blur(var(--blur-thin));-webkit-backdrop-filter:blur(var(--blur-thin));box-shadow:0 10px 30px rgba(10,20,15,.08)}
.glass.specular::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;border-radius:var(--r-card) var(--r-card) 0 0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
.card{padding:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;padding:0 2px}
.section-head:first-of-type{margin-top:4px}
/* pill */
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r-pill);font:600 12px var(--font)}
.pill.success{color:var(--success);background:color-mix(in srgb,var(--success) 16%,transparent)}
.pill.warning{color:var(--warning);background:color-mix(in srgb,var(--warning) 16%,transparent)}
.pill.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,transparent)}
.pill.neutral{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
/* widget shell */
.widget{margin-bottom:12px}
.widget-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px}
.widget-head b{font-size:15px;font-weight:700}
.widget-value{font-size:30px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin:2px 0}
.widget-sub{font-size:12.5px;color:var(--muted)}
.widget-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.hero-num{color:var(--ink)}
/* selects & segmented */
.segmented{display:flex;padding:3px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--ink) 6%,transparent);gap:2px}
.segmented button{flex:1;border:0;background:transparent;border-radius:var(--r-pill);padding:8px 10px;color:var(--muted);font:600 12.5px var(--font);cursor:pointer;white-space:nowrap}
.segmented button.active{background:var(--ink);color:var(--bg)}
.selectbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.selectbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--border);background:var(--mat-thin);color:var(--ink);border-radius:var(--r-pill);padding:8px 13px;font:600 12.5px var(--font);cursor:pointer}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.field,input.field,textarea.field{width:100%;border:1px solid var(--border);background:var(--mat-thin);border-radius:var(--r-control);padding:12px 13px;color:var(--ink);font:500 16px var(--font);outline:none}
select.field:focus,input.field:focus,textarea.field:focus{border-color:var(--accent)}
label.flabel{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 3px;text-transform:uppercase;letter-spacing:.4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-group{margin-bottom:14px}
/* donut / rings via conic-gradient */
.donut{width:118px;height:118px;border-radius:50%;flex:none;position:relative}
.donut:after{content:'';position:absolute;inset:20px;border-radius:50%;background:var(--mat-regular)}
.donut-center{position:absolute;inset:20px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:13px}
.legend{display:grid;gap:9px;flex:1;min-width:0}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend-row b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.arc{width:74px;height:74px;border-radius:50%;position:relative;flex:none}
.arc:after{content:attr(data-pct);position:absolute;inset:9px;border-radius:50%;background:var(--mat-regular);display:grid;place-items:center;font-weight:800;font-size:13px}
/* line/area chart */
.chart-wrap{margin-top:8px}
.chart-wrap svg{width:100%;height:120px;display:block;overflow:visible}
.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:4px}
/* lists */
.list{display:grid;gap:9px}
.list-empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
.list-empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.5}
.group-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 6px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.group-head b{color:var(--ink);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
/* swipe rows */
.swipe-row{position:relative;overflow:hidden;border-radius:18px}
.swipe-actions{position:absolute;inset:0 0 0 auto;display:flex;width:148px;z-index:0;background:color-mix(in srgb,var(--ink) 78%,transparent);border-radius:0 18px 18px 0;opacity:0;pointer-events:none;transition:opacity .16s}
.swipe-row.open .swipe-actions{opacity:1;pointer-events:auto}
.swipe-action{flex:1;border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:600 11px var(--font)}
.swipe-action svg{width:17px;height:17px}
.swipe-action.delete{color:#ffd7dc}
.swipe-content{position:relative;z-index:1;transform:translateX(0);transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.swipe-row.open .swipe-content{transform:translateX(-148px)}
.row{display:flex;align-items:center;gap:12px;padding:13px;border-radius:18px;background:var(--mat-thin);border:1px solid var(--border);cursor:pointer}
.row-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.row-icon svg{width:19px;height:19px}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.row-value{text-align:right;flex:none}
.row-value b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.row-value span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.money-pos{color:var(--success)}
.money-neg{color:var(--danger)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));background:var(--mat-ultrathin);border-top:1px solid var(--border);backdrop-filter:blur(var(--blur-thin)) saturate(1.5);-webkit-backdrop-filter:blur(var(--blur-thin)) saturate(1.5);display:flex}
.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;font:600 10.5px var(--font);border-radius:14px}
.tabbar button svg{width:22px;height:22px}
.tabbar button.active{color:var(--accent)}
.fab{position:fixed;z-index:7;right:max(18px,env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:19px;cursor:pointer;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 26px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(6,10,14,.42);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.modal-panel{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--mat-thick);border:1px solid var(--border);border-radius:26px 26px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));backdrop-filter:blur(var(--blur-regular));-webkit-backdrop-filter:blur(var(--blur-regular))}
@media(min-width:640px){.modal-panel{border-radius:26px;max-height:88vh}}
.modal-panel:before{content:'';display:block;width:36px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 12px}
@media(min-width:640px){.modal-panel:before{display:none}}
.modal-head{position:sticky;top:-16px;margin:-16px -16px 16px;padding:16px;background:inherit;display:flex;align-items:center;justify-content:space-between;z-index:2;border-radius:26px 26px 0 0}
.modal-head h2{margin:0;font-size:18px;font-weight:800}
.modal-close{border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);width:32px;height:32px;border-radius:11px;font-size:16px;cursor:pointer}
.modal-save{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:13px;padding:11px 16px;font:700 14px var(--font);cursor:pointer;width:100%;margin-top:6px}
.modal-save.danger{background:linear-gradient(135deg,var(--danger),#B9302F)}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-toggle button{flex:1;padding:11px 6px;border-radius:14px;border:1px solid var(--border);background:var(--mat-thin);color:var(--muted);font:700 12.5px var(--font);cursor:pointer}
.type-toggle button.active{border-color:transparent;color:#fff}
.type-toggle button.active[data-k="gasto"],.type-toggle button.active[data-k="venda"],.type-toggle button.active[data-k="emprestimo"]{background:linear-gradient(135deg,var(--danger),#B9302F)}
.type-toggle button.active[data-k="lucro"],.type-toggle button.active[data-k="compra"]{background:linear-gradient(135deg,var(--success),#0F8F5C)}
.type-toggle button.active[data-k="transferencia"]{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.calc-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:var(--mat-thin);border:1px solid var(--border);margin-bottom:14px}
.calc-row b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.cat-pick{border:2px solid transparent;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:14px;color:var(--ink)}
.cat-pick.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cat-pick .ci{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff}
.cat-pick .ci svg{width:17px;height:17px}
.cat-pick span{font-size:10px;font-weight:600;text-align:center;line-height:1.15}
.money-hero{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px 16px;border-radius:20px;background:var(--mat-thin);border:1px solid var(--border);margin-bottom:14px}
.money-hero .cur{font-size:22px;font-weight:700;color:var(--muted)}
.money-hero input{border:0;background:transparent;outline:none;font:800 34px var(--font);color:var(--ink);text-align:center;width:100%;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.money-hero input::-webkit-outer-spin-button,.money-hero input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money-hero input::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.money-compact{position:relative}
.money-compact .cur{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:14px;pointer-events:none}
.money-compact input{padding-left:30px;font-weight:800;font-variant-numeric:tabular-nums}
.cat-manage-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--mat-thin);border:1px solid var(--border);margin-bottom:8px;cursor:pointer}
.cat-manage-row .ci{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.cat-manage-row .ci svg{width:16px;height:16px}
.subcat-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--ink) 7%,transparent);font:600 12px var(--font);margin:0 6px 6px 0}
.subcat-chip button{border:0;background:none;color:var(--danger);cursor:pointer;padding:0;display:grid;place-items:center}
.subcat-chip button svg{width:12px;height:12px}
.color-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.color-pick{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer}
.color-pick.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.icon-pick{aspect-ratio:1;border-radius:13px;border:2px solid var(--border);background:var(--mat-thin);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.icon-pick svg{width:17px;height:17px}
.icon-pick.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%) translateY(-14px);z-index:50;background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:12px 18px;border-radius:14px;font:600 13px var(--font);opacity:0;transition:.28s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{position:relative;overflow:hidden;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:10px}
.skel:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 6%,transparent),transparent);animation:shine 1.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.reorder-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--mat-thin);border:1px solid var(--border);margin-bottom:8px}
.reorder-row b{flex:1;font-size:13.5px;font-weight:600}
.reorder-row .icon-btn{width:32px;height:32px}
.reorder-row .icon-btn:disabled{opacity:.3}
.setting-row{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.setting-row:last-child{border:0}
.setting-row .si{width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.setting-row .si svg{width:16px;height:16px}
.setting-row b{display:block;font-size:14.5px;font-weight:600}
.setting-row span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.setting-row .chev{margin-left:auto;color:var(--muted)}
.login-screen{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);padding:30px}
.login-mark{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font:800 26px var(--font);margin-bottom:16px}
.login-card h1{font-size:27px;font-weight:800;margin:0 0 6px;letter-spacing:-.6px}
.login-card p{color:var(--muted);margin:0 0 22px;font-size:14px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:18px 0}
.divider:before,.divider:after{content:'';height:1px;background:var(--border);flex:1}
.acc-badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.acc-badge svg{width:20px;height:20px}
.foreign{display:flex;flex-direction:column;align-items:flex-end}
.foreign small{font-size:11px;color:var(--muted);font-weight:500}
.fx-note{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:2px}
.hr-nav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.hr-nav b{flex:1;text-align:center;font-size:15px;font-weight:700}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}
.weekdays{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.day{min-height:44px;border:0;background:transparent;border-radius:13px;color:var(--ink);font:600 13px var(--font);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day.muted{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.day .dot{width:4px;height:4px;background:var(--accent)}
.day.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.day.selected:not(.today){background:color-mix(in srgb,var(--accent) 18%,transparent)}
.empty-cta{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 16px}
.empty-cta svg{width:36px;height:36px;color:var(--muted)}
.empty-cta button{border:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:13px;font:700 13px var(--font);cursor:pointer}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 return {
  seedVersion:SEED_VERSION,
  loggedIn:false,
  page:'geral', prevPage:'geral',
  profile:{name:'',birthday:'',email:''},
  prefs:{theme:'system',currency:'BRL',dateFormat:'DD/MM/AAAA',language:'pt',accentPreset:'classico'},

 };
}
(function(){
 let s;
 try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){s=null}

  // migração best-effort a partir do app "Horas" antigo (localStorage local, sem backend — 02-App-Architecture §6)
  let legacy=null;
  try{legacy=JSON.parse(localStorage.getItem('horas-liquid-v1'))}catch(e){}
  s=seed();
  if(legacy&&Array.isArray(legacy.works)&&Array.isArray(legacy.records)){
   const map={};
   s.trabalhos=legacy.works.map(w=>{const id=Math.random().toString(36).slice(2,10);map[w.id]=id;return {id,nome:w.name,inicioJornada:w.start||'09:00',fimJornada:w.end||'18:00',pausa:w.breakMin||0,valorHora:w.rate||0,valorExtraPadrao:w.extra||0,descricao:w.notes||'',inicioSemana:'segunda'}});
   s.registrosDeHoras=legacy.records.map(r=>({id:Math.random().toString(36).slice(2,10),trabalhoId:map[r.workId]||null,nomeAvulso:map[r.workId]?null:(r.workName||'Trabalho avulso'),data:r.date,inicio:`${r.date}T${r.start||'09:00'}`,fim:`${r.date}T${r.end||'18:00'}`,pausa:r.breakMin||0,valorExtra:r.extra||0,notas:r.notes||''}));
   if(legacy.profile)s.profile={...s.profile,...legacy.profile};
   if(legacy.prefs)s.prefs={...s.prefs,...legacy.prefs};
  }
 } else if(s.seedVersion!==SEED_VERSION){
  // estado anterior ainda continha os dados de demonstração — reinicia em branco, preservando só sessão/preferências reais do usuário
  const loggedIn=s.loggedIn,prefsAntigas=s.prefs;
  s=seed();
  s.loggedIn=!!loggedIn;
  if(prefsAntigas)s.prefs={...s.prefs,...prefsAntigas};
 }
 if(Array.isArray(s.widgetOrderGeral)){
  const o=s.widgetOrderGeral.filter(k=>k!=='gastos7'&&k!=='gastosMes');

 }
 window.state=s;
})();

function money(n,moeda){
 const currency=moeda||state.prefs.currency||'BRL';
 const locale={BRL:'pt-BR',USD:'en-US',EUR:'de-DE',GBP:'en-GB',JPY:'ja-JP'}[currency]||'pt-BR';
 return new Intl.NumberFormat(locale,{style:'currency',currency,maximumFractionDigits:currency==='JPY'?0:2}).format(n||0);
}
function fmtDate(iso){
 if(!iso)return '';
 const [y,m,d]=iso.split('-');
 const fmt=state.prefs.dateFormat||'DD/MM/AAAA';
 if(fmt==='MM/DD/AAAA')return `${m}/${d}/${y}`;
 if(fmt==='AAAA-MM-DD')return `${y}-${m}-${d}`;
 return `${d}/${m}/${y}`;
}
function diaMes(iso){const d=new Date(iso+'T12:00');return d.getDate()}
function nomeMes(iso,curto){const d=new Date(iso+'T12:00');return d.toLocaleDateString('pt-BR',{month:curto?'short':'long'}).replace('.','')}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window._toastT);window._toastT=setTimeout(()=>el.classList.remove('show'),2600)}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ============ CÂMBIO — Frankfurter.app, sem chave (01-PRD §3.7) ============ */
function convert(valor,de,para){
 if(!de||!para||de===para)return valor;
 if(!state.fx||!state.fx.rates)return valor;
 const {base,rates}=state.fx;
 const emBase = de===base ? valor : valor/(rates[de]||1);
 const final = para===base ? emBase : emBase*(rates[para]||1);
 return final;
}
async function refreshMarketData(silent){
 const principal=state.prefs.currency;
 try{
  const r=await fetch(`https://api.frankfurter.app/latest?from=${principal}`);
  if(r.ok){const d=await r.json();state.fx={base:d.base,rates:d.rates,updatedAt:Date.now()}}
 }catch(e){console.warn('câmbio indisponível, mantendo cache',e)}
 const cripto=state.ativosCarteira.filter(a=>a.tipo==='cripto'&&a.codigo&&CRYPTO_IDS[a.codigo.toUpperCase()]);
 if(cripto.length){
  try{
   const ids=[...new Set(cripto.map(a=>CRYPTO_IDS[a.codigo.toUpperCase()]))].join(',');
   const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=${principal.toLowerCase()}`);
   if(r.ok){
    const d=await r.json();
    for(const a of cripto){const cid=CRYPTO_IDS[a.codigo.toUpperCase()];const preco=d[cid]&&d[cid][principal.toLowerCase()];if(preco!=null)state.marketCache[a.id]={preco,moeda:principal,atualizadoEm:Date.now()}}
   }
  }catch(e){console.warn('cotação cripto indisponível, mantendo cache',e)}
 }
 save();
 if(!silent){render();toast('Cotações atualizadas.')}
}

/* ============ DOMÍNIO — fórmulas da 01-PRD.md §4 ============ */
// horas trabalhadas = (fim - início - pausa) / 60, suporta jornada cruzando a meia-noite
function horasRegistro(r){
 const ini=new Date(r.inicio), fim=new Date(r.fim);
 let min=(fim-ini)/60000 - (r.pausa||0);
 if(min<0)min+=1440;
 return Math.max(0,min)/60;
}
function trabalhoDe(r){return r.trabalhoId?state.trabalhos.find(w=>w.id===r.trabalhoId):null}
function valorHoraDe(r){const t=trabalhoDe(r);return t?t.valorHora:0}
// valor do registro = horas x valor/hora + valor extra
function valorRegistro(r){return horasRegistro(r)*valorHoraDe(r)+(r.valorExtra||0)}
function nomeRegistro(r){const t=trabalhoDe(r);return t?t.nome:(r.nomeAvulso||'Trabalho avulso')}
function registrosNoPeriodo(inicio,fim,trabalhoId){
 return state.registrosDeHoras.filter(r=>{
  if(r.data<inicio||r.data>fim)return false;
  if(trabalhoId&&trabalhoId!=='all'&&r.trabalhoId!==trabalhoId)return false;
  return true;
 });
}
function totalAReceber(regs){return regs.reduce((s,r)=>s+valorRegistro(r),0)}
function totalHoras(regs){return regs.reduce((s,r)=>s+horasRegistro(r),0)}
// simulador — bruto/líquido
function simuladorSalario(inicio,fim,trabalhoId,descontoPct){
 const regs=registrosNoPeriodo(inicio,fim,trabalhoId);
 const bruto=totalAReceber(regs);
 const liquido=bruto*(1-(descontoPct||0)/100);
 return {bruto,liquido,horas:totalHoras(regs),registros:regs.length};
}
// gastos em um período (exclui transferências)
function transacoesNoPeriodo(inicio,fim){return state.transacoes.filter(t=>t.data>=inicio&&t.data<=fim)}
function gastosPeriodo(inicio,fim){return transacoesNoPeriodo(inicio,fim).filter(t=>t.tipo==='gasto').reduce((s,t)=>s+convert(t.valor,contaMoeda(t.contaId),state.prefs.currency),0)}
function contaMoeda(id){const c=state.contas.find(x=>x.id===id);return c?c.moeda:state.prefs.currency}
function gastosPorCategoria(inicio,fim){
 const map={};
 transacoesNoPeriodo(inicio,fim).filter(t=>t.tipo==='gasto').forEach(t=>{
  const c=t.categoriaId||'outros';
  map[c]=(map[c]||0)+convert(t.valor,contaMoeda(t.contaId),state.prefs.currency);
 });
 const total=Object.values(map).reduce((s,v)=>s+v,0)||1;
 return Object.entries(map).map(([id,valor])=>({...cat(id),valor,pct:valor/total*100})).sort((a,b)=>b.valor-a.valor);
}
function isoHoje(){return '2026-07-31'}
function diasAtras(n){const d=new Date(isoHoje()+'T12:00');d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function inicioMes(){return isoHoje().slice(0,8)+'01'}
// limite diário — comparação simples
function gastoHoje(){return gastosPeriodo(isoHoje(),isoHoje())}
function statusLimite(){
 const limite=state.limiteDiario.valor||0, gasto=gastoHoje();
 if(!limite)return {pct:0,estado:'vazio'};
 const pct=Math.min(999,Math.round(gasto/limite*100));
 return {pct,gasto,limite,estado:gasto>limite?'ultrapassado':pct>=80?'atencao':'no-caminho'};
}
// objetivo inteligente — aporte necessário
function aporteObjetivo(o){
 const hoje=new Date(isoHoje()+'T12:00'), final=new Date(o.dataFinal+'T12:00');
 let dias=Math.max(1,Math.ceil((final-hoje)/86400000));
 const periodos=o.frequencia==='semanal'?Math.max(1,Math.ceil(dias/7)):dias;
 const falta=Math.max(0,(o.valorAlvo||0)-(o.valorAcumulado||0));
 return {aporte:falta/periodos,periodos,dias,falta,concluido:falta<=0};
}
// patrimônio líquido = soma contas incluídas (ativo) - empréstimos (passivo)
function saldoContaConvertido(c){return convert(c.saldo,c.moeda,state.prefs.currency)}
function patrimonioLiquido(){
 return state.contas.filter(c=>c.incluida).reduce((s,c)=>{
  const v=saldoContaConvertido(c);
  return s+(c.tipo==='emprestimo'?-Math.abs(v):v);
 },0);
}
// carteira — preço de mercado / manual, valor investido, alocação
function ativoQtd(ativoId){
 return state.movimentacoesAtivo.filter(m=>m.ativoId===ativoId).reduce((s,m)=>s+(m.tipo==='compra'?m.quantidade:-m.quantidade),0);
}
function ativoCustoMedio(ativoId){
 const compras=state.movimentacoesAtivo.filter(m=>m.ativoId===ativoId&&m.tipo==='compra');
 const qtd=compras.reduce((s,m)=>s+m.quantidade,0), custo=compras.reduce((s,m)=>s+m.quantidade*m.preco+(m.outrosCustos||0),0);
 return qtd?custo/qtd:0;
}
function ativoPrecoAtual(ativo){
 const mc=state.marketCache[ativo.id];
 if(mc&&mc.preco!=null)return mc.preco;
 return ativoCustoMedio(ativo.id); // sem cotação pública/ainda sem cache — usa custo médio (fallback manual, 01-PRD §3.4)
}
function ativoValorMercado(ativo){return ativoQtd(ativo.id)*ativoPrecoAtual(ativo)}
function valorTotalInvestido(){
 return state.movimentacoesAtivo.reduce((s,m)=>s+(m.tipo==='compra'?1:-1)*(m.quantidade*m.preco+(m.outrosCustos||0)),0);
}
function patrimonioCarteira(){return state.ativosCarteira.reduce((s,a)=>s+ativoValorMercado(a),0)}
function ganhoCapital(){return patrimonioCarteira()-valorTotalInvestido()}
function alocacaoCarteira(){
 const map={};
 state.ativosCarteira.forEach(a=>{const v=ativoValorMercado(a);if(v>0)map[a.tipo]=(map[a.tipo]||0)+v});
 const total=Object.values(map).reduce((s,v)=>s+v,0)||1;
 return Object.entries(map).map(([tipo,valor],i)=>({tipo,nome:TIPOS_ATIVO[tipo],valor,pct:valor/total*100,cor:PALETA_GRAFICO[i%PALETA_GRAFICO.length]}));
}
const PALETA_GRAFICO=['#5E8BFF','#1FA971','#A855F7','#F5A623','#EC4899','#06B6D4','#8D6E63','#F43F5E'];

/* ============ SWIPE ============ */
function closeSwipes(){document.querySelectorAll('.swipe-row.open').forEach(r=>r.classList.remove('open'));swipeOpenId=null}
function bindSwipes(){
 document.querySelectorAll('.swipe-row').forEach(row=>{
  const content=row.querySelector('.swipe-content');
  let startX=0,dx=0,dragging=false;
  content.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;dragging=true;closeSwipes();row.classList.remove('open')},{passive:true});
  content.addEventListener('touchmove',e=>{if(!dragging)return;dx=e.touches[0].clientX-startX},{passive:true});
  content.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;if(dx<-40){row.classList.add('open');swipeOpenId=row.dataset.id}dx=0});
  content.addEventListener('click',e=>{if(row.classList.contains('open')){e.preventDefault();e.stopPropagation();row.classList.remove('open')}});
 });
}

/* ============ WIDGET SHELL — 05-Design-System §7.1 ============ */
function widgetShell({title,pill,value,sub,body,foot,onExpand}){
 return `<div class="widget glass specular card"${onExpand?` onclick="${onExpand}" style="cursor:pointer"`:''}>
  <div class="widget-head"><b>${esc(title)}</b>${pill||''}</div>

  ${body||''}
  ${foot?`<div class="widget-foot">${foot}</div>`:''}
 </div>`;
}
function pillFor(estado,texto){
 const map={'no-caminho':'success','atencao':'warning','ultrapassado':'danger','positivo':'success','negativo':'danger','vazio':'neutral'};
 return `<span class="pill ${map[estado]||'neutral'}">${esc(texto)}</span>`;
}
function emptyState(icon,texto){return `<div class="empty-cta">${ic(icon)}<div class="t-caption">${esc(texto)}</div></div>`}

/* ============ GRÁFICOS ============ */
function donutCss(fatias){
 let acc=0;const stops=fatias.map(f=>{const from=acc;acc+=f.pct;return `${f.cor} ${from}% ${acc}%`}).join(',');
 return fatias.length?`conic-gradient(${stops})`:'color-mix(in srgb, var(--ink) 10%, transparent)';
}
function donutWidget(fatias,centerLabel){
 return `<div style="display:flex;align-items:center;gap:18px;margin-top:8px">
  <div class="donut" style="background:${donutCss(fatias)}"><div class="donut-center">${centerLabel||''}</div></div>
  <div class="legend">${fatias.slice(0,5).map(f=>`<div class="legend-row"><span class="dot" style="background:${f.cor}"></span>${esc(f.nome)}<b>${f.pct.toFixed(0)}%</b></div>`).join('')||'<span class="t-caption">Sem dados no período.</span>'}</div>
 </div>`;
}
function arcWidget(pct,label){
 const clamped=Math.min(100,Math.max(0,pct));
 const color=pct>100?'var(--danger)':pct>=80?'var(--warning)':'var(--success)';
 return `<div class="arc" style="background:conic-gradient(${color} 0 ${clamped}%,color-mix(in srgb, var(--ink) 10%, transparent) ${clamped}%)" data-pct="${label}"></div>`;
}
function lineChart(pontos){
 if(!pontos.length)return `<div class="chart-wrap">${emptyState('trend','Sem lançamentos suficientes ainda.')}</div>`;
 const w=300,h=100,max=Math.max(...pontos.map(p=>p.v),1),min=Math.min(...pontos.map(p=>p.v),0);
 const range=(max-min)||1;
 const step=pontos.length>1?w/(pontos.length-1):0;
 const coords=pontos.map((p,i)=>[i*step,h-((p.v-min)/range)*h]);
 const line=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
 const area=`M0,${h} `+coords.map(c=>'L'+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')+` L${w},${h} Z`;
 const gid='g'+Math.random().toString(36).slice(2,7);
 return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".5"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
  <path d="${area}" fill="url(#${gid})"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  <circle cx="${coords.at(-1)[0]}" cy="${coords.at(-1)[1]}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
 </svg><div class="chart-labels">${pontos.map(p=>`<span>${esc(p.label)}</span>`).join('')}</div></div>`;
}

function evolucaoPatrimonioPontos(periodo){

/* ============ ABA CALENDÁRIO — herdado do Horas (01-PRD §1.4/§3.3) ============ */
function calendario(){
 const cur=state.calMes||isoHoje().slice(0,7);
 const [y,m]=cur.split('-').map(Number);
 const first=new Date(y,m-1,1);
 const startOffset=(first.getDay()+6)%7; // semana começa segunda
 const daysInMonth=new Date(y,m,0).getDate();
 const cells=[];
 for(let i=0;i<startOffset;i++)cells.push(null);
 for(let d=1;d<=daysInMonth;d++)cells.push(d);
 const iso=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const withRecords=new Set(state.registrosDeHoras.map(r=>r.data));
 const selDay=state.calDia||isoHoje();
 const nomeMesAnoRaw=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const nomeMesAno=nomeMesAnoRaw.charAt(0).toUpperCase()+nomeMesAnoRaw.slice(1);
 const dayRecords=state.registrosDeHoras.filter(r=>r.data===selDay).sort((a,b)=>a.inicio.localeCompare(b.inicio));
 return `${topbar('Calendário','Registro de horas')}
 <div class="glass card" style="margin-bottom:14px">
  <div class="hr-nav">
   <button class="icon-btn" onclick="calMoveMes(-1)">${ic('chevronL')}</button>
   <b>${nomeMesAno}</b>
   <button class="icon-btn" onclick="calMoveMes(1)">${ic('chevron')}</button>
  </div>
  <div class="weekdays"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
  <div class="days">${cells.map(d=>{
   if(!d)return '<span></span>';
   const dIso=iso(d);
   const isToday=dIso===isoHoje();
   const isSel=dIso===selDay;
   return `<button class="day ${isToday?'today':''} ${isSel&&!isToday?'selected':''}" onclick="state.calDia='${dIso}';render()">${d}${withRecords.has(dIso)?'<span class="dot"></span>':''}</button>`;
  }).join('')}</div>
 </div>
 <div class="section-head"><div class="t-headline">${fmtDate(selDay)}</div><span class="t-caption">${dayRecords.length} registro${dayRecords.length===1?'':'s'}</span></div>
 <div class="list">${dayRecords.length?dayRecords.map(r=>registroRow(r)).join(''):emptyState('clock','Nenhum registro neste dia. Toque em + para adicionar.')}</div>
 `;
}
function calMoveMes(dir){
 const cur=state.calMes||isoHoje().slice(0,7);const [y,m]=cur.split('-').map(Number);
 const d=new Date(y,m-1+dir,1);state.calMes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();
}

  const items=grouped[d];
  const subtotal=items.reduce((s,t)=>s+(t.tipo==='gasto'?-t.valor:t.tipo==='lucro'?t.valor:0),0);
  return `<div class="group-head">${fmtDate(d)}<b class="${subtotal>=0?'money-pos':'money-neg'}">${subtotal>=0?'+':''}${money(subtotal)}</b></div><div style="margin-bottom:14px">${items.map(t=>transacaoRow(t)).join('')}</div>`;
 }).join(''):emptyState('transacoes','Nenhuma transação ainda. Toque em + para adicionar.')}</div>
 `;
}
function transacaoRow(t){
 const c=t.tipo==='transferencia'?null:cat(t.categoriaId||'outros');
 const sc=c&&t.subcategoriaId?subcat(t.categoriaId,t.subcategoriaId):null;
 const contaOrigem=state.contas.find(a=>a.id===t.contaId);
 const isTransfer=t.tipo==='transferencia';
 const contaDestino=isTransfer?state.contas.find(a=>a.id===t.contaDestinoId):null;
 return `<div class="swipe-row" data-id="${t.id}"><div class="swipe-actions">
  <button class="swipe-action" onclick="closeSwipes();modalTransacao('${t.id}')">${ic('sliders')}<span>Editar</span></button>
  <button class="swipe-action delete" onclick="excluirTransacao('${t.id}')">${ic('trash')}<span>Excluir</span></button>
 </div><div class="swipe-content"><div class="row" onclick="modalTransacao('${t.id}')">
  <div class="row-icon" style="background:${isTransfer?'linear-gradient(135deg,var(--accent),var(--accent2))':c.cor}">${ic(isTransfer?'arrows':c.icone)}</div>
  <div class="row-main"><b>${esc(t.descricao||(isTransfer?'Transferência':c.nome))}</b><span>${isTransfer?`${esc(contaOrigem?.nome||'')} → ${esc(contaDestino?.nome||'')}`:`${esc(contaOrigem?.nome||'')} · ${esc(c.nome)}${sc?' · '+esc(sc.nome):''}`} · ${t.hora}</span></div>
  <div class="row-value"><b class="${t.tipo==='gasto'?'money-neg':t.tipo==='lucro'?'money-pos':''}">${t.tipo==='gasto'?'-':t.tipo==='lucro'?'+':''}${money(t.valor,contaMoeda(t.contaId))}</b></div>
 </div></div></div>`;
}
function excluirTransacao(id){closeSwipes();state.transacoes=state.transacoes.filter(t=>t.id!==id);render();toast('Transação excluída.')}

/* ============ CATEGORIAS EDITÁVEIS — 05-Design-System §2.3 (paleta e ícones fechados) ============ */
function modalCategorias(){
 const body=`<div class="list">${state.categorias.map(c=>`<div class="cat-manage-row" onclick="modalCategoria('${c.id}')"><span class="ci" style="background:${c.cor}">${ic(c.icone)}</span><div class="row-main"><b>${esc(c.nome)}</b><span>${c.subcategorias.length} subcategoria${c.subcategorias.length===1?'':'s'}</span></div><span class="chev" style="color:var(--muted)">${ic('chevron')}</span></div>`).join('')}</div>
 <button class="modal-save" onclick="modalCategoria()">Nova categoria</button>`;
 modal=modalShell('Categorias',body);
 render();
}
function modalCategoria(id){
 const c=id?cat(id):{id:null,nome:'',cor:PALETA_CATEGORIA_CORES[0],icone:PALETA_CATEGORIA_ICONES[0],subcategorias:[]};
 const isOutros=id==='outros';
 const body=`
 <div class="field-group"><label class="flabel">Nome</label><input class="field" id="ctf-nome" value="${esc(c.nome)}" placeholder="Ex.: Farmácia" ${isOutros?'disabled':''}></div>
 <div class="field-group"><label class="flabel">Cor</label><div class="color-grid" id="ctf-cores">${PALETA_CATEGORIA_CORES.map(cor=>`<button type="button" class="color-pick ${c.cor===cor?'active':''}" data-cor="${cor}" style="background:${cor}" onclick="pickCor(this)"></button>`).join('')}</div></div>
 <div class="field-group"><label class="flabel">Ícone</label><div class="icon-grid" id="ctf-icones">${PALETA_CATEGORIA_ICONES.map(icn=>`<button type="button" class="icon-pick ${c.icone===icn?'active':''}" data-icone="${icn}" onclick="pickIcone(this)">${ic(icn)}</button>`).join('')}</div></div>
 <div class="field-group"><label class="flabel">Subcategorias</label>
  <div id="ctf-subcats">${(c.subcategorias||[]).map(s=>`<span class="subcat-chip" data-sub-id="${s.id}"><span>${esc(s.nome)}</span><button type="button" onclick="this.parentElement.remove()">${ic('close')}</button></span>`).join('')||`<span class="t-caption" id="ctf-subcats-empty">Nenhuma ainda.</span>`}</div>
  <div style="display:flex;gap:8px;margin-top:8px"><input class="field" id="ctf-novasub" placeholder="Nova subcategoria"><button type="button" class="icon-btn" onclick="addSubcategoriaTemp()">${ic('plus')}</button></div>
 </div>
 <button class="modal-save" onclick="salvarCategoria('${id||''}')">Salvar</button>
 ${id&&!isOutros?`<button class="modal-save danger" onclick="excluirCategoria('${id}')">Excluir categoria</button>`:''}`;
 modal=modalShell(id?'Editar categoria':'Nova categoria',body,{onClose:'modalCategorias()'});
 render();
}
function pickCor(btn){document.querySelectorAll('#ctf-cores .color-pick').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function pickIcone(btn){document.querySelectorAll('#ctf-icones .icon-pick').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function addSubcategoriaTemp(){
 const input=$('#ctf-novasub');
 const nome=input.value.trim();
 if(!nome)return;
 const wrap=$('#ctf-subcats');
 const empty=document.getElementById('ctf-subcats-empty');
 if(empty)empty.remove();
 const chip=document.createElement('span');
 chip.className='subcat-chip';chip.dataset.subId=uid();
 chip.innerHTML=`<span>${esc(nome)}</span><button type="button" onclick="this.parentElement.remove()">${ICONS.close}</button>`;
 wrap.appendChild(chip);
 input.value='';
}
function salvarCategoria(id){
 const nome=$('#ctf-nome').value.trim();
 if(!id&&!nome){toast('Digite um nome para a categoria.');return}
 const cor=document.querySelector('#ctf-cores .color-pick.active')?.dataset.cor||PALETA_CATEGORIA_CORES[0];
 const icone=document.querySelector('#ctf-icones .icon-pick.active')?.dataset.icone||PALETA_CATEGORIA_ICONES[0];
 const subcategorias=[...document.querySelectorAll('#ctf-subcats .subcat-chip')].map(el=>({id:el.dataset.subId,nome:el.querySelector('span').textContent}));
 if(id){
  const c=cat(id);
  Object.assign(c,{nome:id==='outros'?c.nome:(nome||c.nome),cor,icone,subcategorias});
 }else{
  state.categorias.push({id:uid(),nome:nome||'Categoria',cor,icone,subcategorias});
 }
 modalCategorias();toast('Categoria salva.');
}
function excluirCategoria(id){
 if(id==='outros'){toast('A categoria "Outros" não pode ser excluída.');return}
 state.categorias=state.categorias.filter(c=>c.id!==id);
 state.transacoes.forEach(t=>{if(t.categoriaId===id){t.categoriaId='outros';t.subcategoriaId=null}});
 modalCategorias();toast('Categoria excluída.');
}
function modalTransacao(id){
 const t=id?state.transacoes.find(x=>x.id===id):{tipo:'gasto',valor:'',descricao:'',data:isoHoje(),hora:new Date().toTimeString().slice(0,5),contaId:state.contas[0]?.id,contaDestinoId:null,categoriaId:'outros',subcategoriaId:null};
 const body=`
 <div class="type-toggle">
  ${['gasto','lucro','transferencia'].map(k=>`<button data-k="${k}" class="${t.tipo===k?'active':''}" onclick="setTransacaoTipo('${k}')">${k==='gasto'?'Gasto':k==='lucro'?'Lucro':'Transferência'}</button>`).join('')}
 </div>
 <div class="field-group"><label class="flabel">Valor</label>${moneyHero('tf-valor',t.valor)}</div>
 <div class="field-group"><label class="flabel">Descrição</label><input class="field" id="tf-desc" value="${esc(t.descricao||'')}" placeholder="Ex.: Supermercado"></div>
 <div class="field-row">
  <div class="field-group"><label class="flabel">Data</label><input class="field" id="tf-data" type="date" value="${t.data}"></div>
  <div class="field-group"><label class="flabel">Hora</label><input class="field" id="tf-hora" type="time" value="${t.hora}"></div>
 </div>
 <div class="field-group"><label class="flabel">Conta${t.tipo==='transferencia'?' de origem':''}</label><select class="field" id="tf-conta">${state.contas.map(a=>`<option value="${a.id}" ${t.contaId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select></div>
 <div class="field-group" id="tf-destino-wrap" style="display:${t.tipo==='transferencia'?'block':'none'}"><label class="flabel">Conta de destino</label><select class="field" id="tf-destino">${state.contas.map(a=>`<option value="${a.id}" ${t.contaDestinoId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select></div>
 <div class="field-group" id="tf-cat-wrap" style="display:${t.tipo==='transferencia'?'none':'block'}"><label class="flabel">Categoria</label>
  <div class="cat-grid">${state.categorias.map(c=>`<button type="button" class="cat-pick ${t.categoriaId===c.id?'active':''}" data-cat="${c.id}" onclick="pickCategoria('${c.id}')"><span class="ci" style="background:${c.cor}">${ic(c.icone)}</span><span>${esc(c.nome)}</span></button>`).join('')}</div>
  <div id="tf-subcat-wrap" style="margin-top:10px">${subcatChips(t.categoriaId,t.subcategoriaId)}</div>
 </div>
 <button class="modal-save" onclick="salvarTransacao('${id||''}')">Salvar</button>`;
 modal=modalShell(id?'Editar transação':'Nova transação',body);
 render();
}
function subcatChips(categoriaId,selectedId){
 const c=cat(categoriaId);
 if(!c||!c.subcategorias.length)return '';
 return `<div class="flabel" style="margin-bottom:8px">Subcategoria</div><div class="selectbar" style="overflow:visible;flex-wrap:wrap">
  <button type="button" class="chip ${!selectedId?'active':''}" data-subcat="" onclick="pickSubcategoria('')">Nenhuma</button>
  ${c.subcategorias.map(s=>`<button type="button" class="chip ${selectedId===s.id?'active':''}" data-subcat="${s.id}" onclick="pickSubcategoria('${s.id}')">${esc(s.nome)}</button>`).join('')}
 </div>`;
}
function pickSubcategoria(id){document.querySelectorAll('#tf-subcat-wrap .chip').forEach(b=>b.classList.toggle('active',b.dataset.subcat===id))}
function setTransacaoTipo(k){
 document.querySelectorAll('.type-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
 $('#tf-destino-wrap').style.display=k==='transferencia'?'block':'none';
 $('#tf-cat-wrap').style.display=k==='transferencia'?'none':'block';
 modal=modal.replace(/data-k="(gasto|lucro|transferencia)" class="active"/,'').replace(new RegExp(`data-k="${k}"`),`data-k="${k}" class="active"`);
}
function pickCategoria(id){
 document.querySelectorAll('.cat-pick').forEach(b=>b.classList.toggle('active',b.dataset.cat===id));
 document.getElementById('tf-subcat-wrap').innerHTML=subcatChips(id,null);
}
function salvarTransacao(id){
 const tipo=document.querySelector('.type-toggle button.active')?.dataset.k||'gasto';
 const categoriaId=document.querySelector('.cat-pick.active')?.dataset.cat||'outros';
 const subcategoriaId=document.querySelector('#tf-subcat-wrap .chip.active')?.dataset.subcat||null;
 const data={
  tipo,valor:parseFloat($('#tf-valor').value)||0,descricao:$('#tf-desc').value.trim(),
  data:$('#tf-data').value,hora:$('#tf-hora').value,contaId:$('#tf-conta').value,
  contaDestinoId:tipo==='transferencia'?$('#tf-destino').value:null,
  categoriaId:tipo==='transferencia'?null:categoriaId,
  subcategoriaId:tipo==='transferencia'?null:(subcategoriaId||null),
 };
 if(id){Object.assign(state.transacoes.find(t=>t.id===id),data)}else{state.transacoes.push({id:uid(),...data})}
 modal=null;render();toast('Transação salva.');
}

/* ============ AJUSTES — 01-PRD §3.6 ============ */
function ajustes(){
 const rows=[
  ['user','Perfil','Nome, aniversário e e-mail','modalPerfil()'],
  ['palette','Personalizar',`Idioma, tema, moeda (${state.prefs.currency}) e formato de data`,'modalPersonalizar()'],
  ['contas','Cadastro de trabalhos',`${state.trabalhos.length} trabalho${state.trabalhos.length===1?'':'s'} cadastrado${state.trabalhos.length===1?'':'s'}`,'modalTrabalhos()'],
  ['cloud','Relatórios / backup','Exportar dados em CSV ou PDF','modalBackup()'],
  ['lock','Bloqueio de senha','Proteja o acesso ao app','toast(\'Configure uma senha de bloqueio nesta demonstração.\')'],
  ['share','Compartilhar este app','Envie o app para amigos','compartilharApp()'],
  ['star','Avaliar app','Conte como está sendo sua experiência','toast(\'A página de avaliação será aberta na loja.\')'],
  ['info','Sobre','Recursos, créditos e versão','modalSobre()'],
  ['mail','Contate-nos','Fale com a nossa equipe',`location.href='mailto:suporte@horas.app?subject=Suporte%20Horas'`],
 ];
 return `<div class="topbar"><button class="icon-btn" onclick="backFromAjustes()">${ic('chevronL')}</button><h1 style="flex:1;text-align:center;font-size:18px">Ajustes</h1><span style="width:38px"></span></div>
 <div class="glass card" style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
  <div class="avatar-btn" style="width:52px;height:52px;font-size:19px">${(state.profile.name||'?')[0].toUpperCase()}</div>
  <div class="row-main"><b style="font-size:16px">${esc(state.profile.name||'Sem nome')}</b><span>${esc(state.profile.email||'')}</span></div>
 </div>
 <div class="glass" style="padding:2px 14px">${rows.map(([icon,title,sub,action])=>`<div class="setting-row" onclick="${action}"><div class="si">${ic(icon)}</div><div><b>${title}</b><span>${sub}</span></div><span class="chev">${ic('chevron')}</span></div>`).join('')}</div>
 <button class="modal-save" style="max-width:560px;margin-top:22px;background:var(--mat-thin);color:var(--danger);border:1px solid var(--border)" onclick="sair()">Sair da conta</button>

}

function modalPersonalizar(){

function pickSeg(id,btn){document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function salvarPersonalizar(){
 const moedaAntiga=state.prefs.currency;
 state.prefs={...state.prefs,

function modalTrabalhos(){
 const body=`<div class="list">${state.trabalhos.length?state.trabalhos.map(w=>`<div class="row" onclick="modalTrabalho('${w.id}')"><div class="row-icon" style="background:linear-gradient(135deg,var(--accent),var(--accent2))">${ic('contas')}</div><div class="row-main"><b>${esc(w.nome)}</b><span>${w.inicioJornada}–${w.fimJornada} · ${money(w.valorHora)}/h</span></div><span class="chev" style="color:var(--muted)">${ic('chevron')}</span></div>`).join(''):emptyState('contas','Nenhum trabalho cadastrado.')}</div>`;

function modalTrabalho(id){
 const w=id?state.trabalhos.find(x=>x.id===id):{nome:'',inicioJornada:'09:00',fimJornada:'18:00',pausa:0,valorHora:'',valorExtraPadrao:'',descricao:'',inicioSemana:'segunda'};
 const temRegistros=id&&state.registrosDeHoras.some(r=>r.trabalhoId===id);
 const body=`
 <div class="field-group"><label class="flabel">Nome do trabalho</label><input class="field" id="wf-nome" value="${esc(w.nome)}"></div>
 <div class="field-row">
  <div class="field-group"><label class="flabel">Início de jornada</label><input class="field" id="wf-inicio" type="time" value="${w.inicioJornada}"></div>
  <div class="field-group"><label class="flabel">Fim de jornada</label><input class="field" id="wf-fim" type="time" value="${w.fimJornada}"></div>
 </div>
 <div class="field-group"><label class="flabel">Pausa (min)</label><input class="field" id="wf-pausa" type="number" value="${w.pausa||0}"></div>
 ${moneyCompact('wf-valorhora',w.valorHora,'Valor por hora')}
 ${moneyCompact('wf-extra',w.valorExtraPadrao,'Valor extra padrão')}
 <div class="field-group"><label class="flabel">Descrição</label><textarea class="field" id="wf-desc" rows="2">${esc(w.descricao||'')}</textarea></div>
 <div class="field-group"><label class="flabel">Início da semana</label><select class="field" id="wf-semana">${['domingo','segunda'].map(d=>`<option ${w.inicioSemana===d?'selected':''}>${d}</option>`).join('')}</select></div>
 <button class="modal-save" onclick="salvarTrabalho('${id||''}')">Salvar</button>
 ${id?`<button class="modal-save danger" onclick="excluirTrabalho('${id}')" ${temRegistros?'disabled style="opacity:.5"':''}>${temRegistros?'Resolva os registros vinculados para excluir':'Excluir trabalho'}</button>`:''}`;

function salvarTrabalho(id){
 const data={nome:$('#wf-nome').value.trim()||'Trabalho',inicioJornada:$('#wf-inicio').value,fimJornada:$('#wf-fim').value,pausa:parseInt($('#wf-pausa').value)||0,valorHora:parseFloat($('#wf-valorhora').value)||0,valorExtraPadrao:parseFloat($('#wf-extra').value)||0,descricao:$('#wf-desc').value,inicioSemana:$('#wf-semana').value};
 if(id){Object.assign(state.trabalhos.find(w=>w.id===id),data)}else{state.trabalhos.push({id:uid(),...data})}
 modalTrabalhos();toast('Trabalho salvo.');

function excluirTrabalho(id){
 if(state.registrosDeHoras.some(r=>r.trabalhoId===id)){toast('Este trabalho tem registros vinculados. Exclua-os primeiro.');return}
 state.trabalhos=state.trabalhos.filter(w=>w.id!==id);modalTrabalhos();toast('Trabalho excluído.');
}

 ${moneyCompact('of-alvo',o.valorAlvo,'Valor alvo')}
 ${moneyCompact('of-acum',o.valorAcumulado,'Já acumulado')}
 <div class="field-group"><label class="flabel">Data final</label><input class="field" id="of-data" type="date" value="${o.dataFinal}"></div>
 <div class="field-group"><label class="flabel">Frequência do aporte</label><div class="segmented" id="of-freq"><button type="button" class="${o.frequencia==='diaria'?'active':''}" data-v="diaria" onclick="pickSeg('of-freq',this)">Diária</button><button type="button" class="${o.frequencia!=='diaria'?'active':''}" data-v="semanal" onclick="pickSeg('of-freq',this)">Semanal</button></div></div>
 <button class="modal-save" onclick="salvarObjetivo('${id||''}')">Salvar</button>
 ${id?`<button class="modal-save danger" onclick="excluirObjetivo('${id}')">Excluir objetivo</button>`:''}`;
 modal=modalShell(id?'Editar objetivo':'Novo objetivo',body);
 render();
}
function salvarObjetivo(id){
 const data={nome:$('#of-nome').value.trim()||'Objetivo',valorAlvo:parseFloat($('#of-alvo').value)||0,valorAcumulado:parseFloat($('#of-acum').value)||0,dataFinal:$('#of-data').value,frequencia:document.querySelector('#of-freq button.active').dataset.v};
 if(id){Object.assign(state.objetivos.find(o=>o.id===id),data)}else{state.objetivos.push({id:uid(),...data})}
 modal=null;render();toast('Objetivo salvo.');
}
function excluirObjetivo(id){state.objetivos=state.objetivos.filter(o=>o.id!==id);modal=null;render();toast('Objetivo excluído.')}
function modalLimiteDiario(){
 const body=`
 <div class="field-group"><label class="flabel">Valor do limite por dia</label>${moneyHero('lf-valor',state.limiteDiario.valor||'')}</div>
 <button class="modal-save" onclick="salvarLimiteDiario()">Salvar</button>`;
 modal=modalShell('Limite diário',body);
 render();
}
function salvarLimiteDiario(){state.limiteDiario.valor=parseFloat($('#lf-valor').value)||0;modal=null;render();toast('Limite diário atualizado.')}
function modalSobre(){
 const body=`
 <p class="t-body">Horas reúne controle de gastos, contas, horas trabalhadas e carteira de investimentos em uma única experiência, com visual e interações inspirados no ecossistema Apple.</p>
 <p class="t-caption">Versão 0.3 (protótipo local) · dados salvos apenas neste navegador · cotações de câmbio via Frankfurter.app e cripto via CoinGecko, quando disponíveis.</p>`;
 modal=modalShell('Sobre',body);
 render();
}
function modalBackup(){
 const body=`
 <p class="t-caption" style="margin-top:0">Exporta contas, transações, horas trabalhadas e carteira de investimentos.</p>
 <div style="display:flex;gap:10px;margin-top:14px">
  <button class="modal-save" onclick="exportarCSV()">Exportar CSV</button>
  <button class="modal-save" style="background:var(--mat-thin);color:var(--ink);border:1px solid var(--border)" onclick="window.print()">Exportar PDF</button>
 </div>
 <div style="display:flex;gap:10px;margin-top:10px">
  <button class="modal-save" style="background:var(--mat-thin);color:var(--ink);border:1px solid var(--border)" onclick="exportarJSON()">Exportar dados (.json)</button>
 </div>`;
 modal=modalShell('Relatórios / backup',body);
 render();
}
function baixarArquivo(nome,conteudo,tipo){
 const blob=new Blob([conteudo],{type:tipo});const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=nome;a.click();URL.revokeObjectURL(url);
}
function exportarCSV(){
 const linhas=['tipo;data;descricao;valor;moeda'];
 state.transacoes.forEach(t=>linhas.push(`transacao;${t.data};${t.descricao||''};${t.valor};${contaMoeda(t.contaId)}`));
 state.registrosDeHoras.forEach(r=>linhas.push(`registro_horas;${r.data};${nomeRegistro(r)};${valorRegistro(r).toFixed(2)};${state.prefs.currency}`));
 state.movimentacoesAtivo.forEach(m=>linhas.push(`${m.tipo}_ativo;${m.data};${state.ativosCarteira.find(a=>a.id===m.ativoId)?.nome||''};${m.valorTotal.toFixed(2)};${state.prefs.currency}`));
 baixarArquivo('horas-export.csv',linhas.join('\\n'),'text/csv');toast('CSV exportado.');
}
function exportarJSON(){baixarArquivo('horas-backup.json',JSON.stringify(state,null,2),'application/json');toast('Backup exportado.')}

/* ============ INIT ============ */
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.prefs.theme==='system')render()});
render();
if(state.loggedIn)refreshMarketData(true);
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
